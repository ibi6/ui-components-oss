<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>流式界面 · 参考实现</title>
<style>
/* ===== tokens (ui-fused) ===== */
/* Fluid tokens: 360px -> 1440px viewport. Generated by scripts/fluid_scale.py */
:root {
  /* Type scale */
  --step-xs: clamp(0.6944rem, 0.6859rem + 0.0379vw, 0.72rem);
  --step-sm: clamp(0.8333rem, 0.8111rem + 0.0988vw, 0.9rem);
  --step-base: clamp(1rem, 0.9583rem + 0.1852vw, 1.125rem);
  --step-lg: clamp(1.2rem, 1.1312rem + 0.3056vw, 1.406rem);
  --step-xl: clamp(1.44rem, 1.3341rem + 0.4708vw, 1.758rem);
  --step-2xl: clamp(1.728rem, 1.5716rem + 0.6952vw, 2.197rem);
  --step-3xl: clamp(2.074rem, 1.8493rem + 0.9970vw, 2.747rem);
  --step-4xl: clamp(2.488rem, 2.1734rem + 1.3999vw, 3.433rem);

  /* Layout spacing (fluid). Inside components use the fixed --space-* tokens. */
  --gutter: clamp(1rem, 0.5000rem + 2.2222vw, 2.5rem);
  --flow-s: clamp(1.5rem, 1.3333rem + 0.7407vw, 2rem);
  --flow-m: clamp(2rem, 1.5000rem + 2.2222vw, 3.5rem);
  --flow-l: clamp(3rem, 2.0000rem + 4.4444vw, 6rem);
  --flow-xl: clamp(4.5rem, 3.0000rem + 6.6667vw, 9rem);
}

/* ui-fused base (from ui-tidy). Neutral ramp + radius + elevation + fixed spacing grid + sane typography.
   Change --accent (and optionally the neutral hue) per brief; keep everything else. */

:root {
  color-scheme: light dark;

  /* Surfaces: three steps are enough. Depth comes from lightness + a hairline, not heavy shadow. */
  --bg:        light-dark(#f7f7f5, #0d0e10);
  --surface:   light-dark(#ffffff, #151719);
  --surface-2: light-dark(#f1f1ee, #1c1f22);
  --line:        light-dark(rgb(16 18 22 / 0.08), rgb(255 255 255 / 0.08));
  --line-strong: light-dark(rgb(16 18 22 / 0.16), rgb(255 255 255 / 0.16));

  /* Text: exactly three levels. */
  --text:   light-dark(#15171a, #ececee);
  --text-2: light-dark(#575c64, #a4a9b2);
  --text-3: light-dark(#868c96, #6e747e);

  /* One accent. Soft/ink variants are derived, never hand-picked. */
  --accent:      light-dark(oklch(0.56 0.16 255), oklch(0.74 0.14 255));
  --accent-ink:  light-dark(#ffffff, #0d0e10);
  --accent-soft: color-mix(in oklab, var(--accent) 12%, transparent);
  --success: light-dark(oklch(0.58 0.14 155), oklch(0.78 0.14 155));
  --danger:  light-dark(oklch(0.58 0.19 25), oklch(0.74 0.16 25));

  /* Fixed 4px grid for anything INSIDE a component. Section-level spacing uses fluid --flow-*. */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;

  /* Radii. Nested rule: inner radius = outer radius - padding between them. */
  --radius-xs: 6px; --radius-s: 10px; --radius-m: 14px; --radius-l: 22px; --radius-pill: 999px;

  /* Elevation: two layers (tight + ambient). Dark mode relies on borders more than shadow. */
  --shadow-1: 0 1px 2px rgb(16 18 22 / 0.06), 0 1px 1px rgb(16 18 22 / 0.04);
  --shadow-2: 0 2px 4px rgb(16 18 22 / 0.05), 0 8px 24px rgb(16 18 22 / 0.08);
  --shadow-3: 0 4px 8px rgb(16 18 22 / 0.06), 0 24px 56px rgb(16 18 22 / 0.14);

  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --measure: 66ch; /* comfortable reading width; for CJK use ~34em */
}

/* Optional manual theme switch: set <html data-theme="light|dark">. light-dark() follows color-scheme. */
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"]  { color-scheme: dark; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --shadow-1: 0 0 0 1px rgb(255 255 255 / 0.04);
    --shadow-2: 0 8px 24px rgb(0 0 0 / 0.35);
    --shadow-3: 0 24px 56px rgb(0 0 0 / 0.5);
  }
}
:root[data-theme="dark"] {
  --shadow-1: 0 0 0 1px rgb(255 255 255 / 0.04);
  --shadow-2: 0 8px 24px rgb(0 0 0 / 0.35);
  --shadow-3: 0 24px 56px rgb(0 0 0 / 0.5);
}

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 400 var(--step-base, 1rem) / 1.6 var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-wrap: break-word; /* long URLs / IDs wrap instead of forcing horizontal scroll */
}
img, svg, video, canvas { display: block; max-inline-size: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { line-height: 1.2; text-wrap: balance; letter-spacing: -0.01em; }
p, li { text-wrap: pretty; }
code, pre { font-family: var(--font-mono); font-size: 0.92em; }
::selection { background: var(--accent-soft); }

/* Visible, consistent keyboard focus. Never remove outlines without replacing them. */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: inherit; }

/* Layout primitives: spacing is owned by the parent (gap), never by margins on children. */
.stack   { display: flex; flex-direction: column; gap: var(--gap, var(--space-4)); }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap, var(--space-2)); }
.wrap    { inline-size: min(100% - 2 * var(--gutter, 1rem), var(--wrap, 72rem)); margin-inline: auto; }
.grid-auto { display: grid; gap: var(--gap, var(--space-4)); grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--min, 16rem)), 1fr)); }

/* A card is a surface + hairline + one radius + one shadow. Nothing else. */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-1);
  padding: var(--space-4);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  block-size: 40px; padding-inline: var(--space-4);
  border: 1px solid var(--line-strong); border-radius: var(--radius-s);
  background: var(--surface); color: var(--text);
  font-weight: 500; cursor: pointer;
  transition: background var(--dur-fast, 160ms) var(--ease-standard, ease), border-color var(--dur-fast, 160ms) var(--ease-standard, ease);
}
.btn:hover { background: var(--surface-2); }
.btn[data-variant="primary"] { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn[data-variant="primary"]:hover { background: color-mix(in oklab, var(--accent) 88%, black); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.visually-hidden { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ui-fused motion tokens. Drop into :root of any project, or inline into a single-file page. */
:root {
  /* Durations: pick by distance travelled + importance, never by taste. */
  --dur-instant: 90ms;   /* press, toggle, color change */
  --dur-fast: 160ms;     /* hover, tooltip, small fade */
  --dur-base: 260ms;     /* most enter/exit, expand/collapse */
  --dur-slow: 420ms;     /* panels, large layout shifts */
  --dur-hero: 760ms;     /* the single signature moment per view */

  /* Easings: decelerate in (out-curves) for things arriving, accelerate out for leaving. */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);        /* default entrance: fast start, long soft landing */
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);       /* things that move within view */
  --ease-in: cubic-bezier(0.55, 0, 1, 0.45);         /* exits only */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);     /* ambient / looping */
  /* Springs via linear(). Needs a duration of ~500-900ms; overshoot is the point. */
  --ease-spring: linear(0, 0.074, 0.249, 0.462, 0.671, 0.849, 0.982, 1.068, 1.113, 1.126, 1.117, 1.095, 1.068, 1.042, 1.019, 1.002, 0.991, 0.986, 0.984, 0.985, 0.988, 0.991, 0.995, 0.998, 1, 1.001, 1.002, 1);
  --ease-spring-soft: linear(0, 0.037, 0.127, 0.244, 0.37, 0.493, 0.606, 0.704, 0.787, 0.854, 0.906, 0.946, 0.974, 0.994, 1.007, 1.015, 1.019, 1.02, 1.019, 1.018, 1.015, 1.013, 1.01, 1.008, 1.006, 1.004, 1.003, 1);

  /* Choreography */
  --stagger: 55ms;            /* gap between siblings; keep total under ~450ms */
  --reveal-distance: 14px;    /* how far content travels while fading in */
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --reveal-distance: 0px;   /* keep the fade, drop the travel */
    --dur-slow: 200ms;
    --dur-hero: 240ms;
    --stagger: 0ms;
  }
}

/* ---------- Reveal on enter (pairs with motion.js reveal()) ---------- */
@media (scripting: enabled) {
  .reveal {
    opacity: 0;
    transform: translateY(var(--reveal-distance));
    transition:
      opacity var(--dur-slow) var(--ease-out),
      transform var(--dur-slow) var(--ease-out);
    transition-delay: calc(var(--i, 0) * var(--stagger));
  }
  .reveal.is-in { opacity: 1; transform: none; }
}

/* CSS-only stagger index for the first 12 children of a [data-stagger] group */
[data-stagger] > :nth-child(1) { --i: 0; }  [data-stagger] > :nth-child(2) { --i: 1; }
[data-stagger] > :nth-child(3) { --i: 2; }  [data-stagger] > :nth-child(4) { --i: 3; }
[data-stagger] > :nth-child(5) { --i: 4; }  [data-stagger] > :nth-child(6) { --i: 5; }
[data-stagger] > :nth-child(7) { --i: 6; }  [data-stagger] > :nth-child(8) { --i: 7; }
[data-stagger] > :nth-child(9) { --i: 8; }  [data-stagger] > :nth-child(10) { --i: 9; }
[data-stagger] > :nth-child(11) { --i: 10; } [data-stagger] > :nth-child(12) { --i: 11; }

/* ---------- Interaction feedback ---------- */
.press {
  transition: transform var(--dur-instant) var(--ease-standard);
}
.press:active { transform: scale(0.97); }

@media (hover: hover) {
  .lift {
    transition: transform var(--dur-fast) var(--ease-out);
  }
  .lift:hover { transform: translateY(-2px); }
}

/* ---------- Height auto without JS: grid rows 0fr -> 1fr ---------- */
.collapse {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--dur-base) var(--ease-out);
}
.collapse[data-open] { grid-template-rows: 1fr; }
.collapse > * { overflow: hidden; min-height: 0; }

/* ---------- Entry for newly inserted elements (no JS needed) ---------- */
@starting-style {
  .enter { opacity: 0; transform: translateY(var(--reveal-distance)); }
}
.enter {
  transition:
    opacity var(--dur-base) var(--ease-out),
    transform var(--dur-base) var(--ease-out);
}

/* ---------- Dialog / popover with exit animation ---------- */
dialog {
  opacity: 0;
  transform: translateY(8px) scale(0.98);
  transition:
    opacity var(--dur-base) var(--ease-out),
    transform var(--dur-base) var(--ease-out),
    overlay var(--dur-base) allow-discrete,
    display var(--dur-base) allow-discrete;
}
dialog[open] { opacity: 1; transform: none; }
@starting-style {
  dialog[open] { opacity: 0; transform: translateY(8px) scale(0.98); }
}
dialog::backdrop {
  background: rgb(0 0 0 / 0);
  transition: background var(--dur-base) var(--ease-out), overlay var(--dur-base) allow-discrete, display var(--dur-base) allow-discrete;
}
dialog[open]::backdrop { background: rgb(0 0 0 / 0.4); }
@starting-style {
  dialog[open]::backdrop { background: rgb(0 0 0 / 0); }
}

/* ---------- Skeleton shimmer (animates one transform, cheap) ---------- */
.skeleton {
  position: relative;
  overflow: hidden;
  background: color-mix(in oklab, currentColor 8%, transparent);
  border-radius: var(--radius-s, 8px);
}
.skeleton::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, color-mix(in oklab, currentColor 10%, transparent), transparent);
  animation: shimmer 1.4s var(--ease-in-out) infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }

/* ---------- Reduced motion: replace, don't just delete ---------- */
@media (prefers-reduced-motion: reduce) {
  .skeleton::after, .ambient { animation: none; }
  .press:active { transform: none; }
  .lift:hover { transform: none; }
  html { scroll-behavior: auto; }
}


/* ===== page ===== */
html, body { height: 100%; }
.app {
  display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: var(--space-3) var(--gutter);
  border-bottom: 1px solid var(--line);
  background: color-mix(in oklab, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  position: relative; z-index: 2;
}
.brand { display: flex; align-items: center; gap: var(--space-3); }
.brand h1 { font-size: var(--step-base); font-weight: 600; letter-spacing: 0; }
.logo {
  inline-size: 22px; block-size: 22px; border-radius: var(--radius-xs);
  background: conic-gradient(from 210deg, var(--accent), color-mix(in oklab, var(--accent) 40%, white), var(--accent));
}
.tools { display: flex; align-items: center; gap: var(--space-3); }
.ghost {
  block-size: 32px; padding-inline: var(--space-3); border-radius: var(--radius-s);
  border: 1px solid transparent; background: transparent; color: var(--text-2); cursor: pointer;
  font-size: var(--step-sm);
  transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard);
}
.ghost:hover { background: var(--surface-2); color: var(--text); }

.status {
  display: inline-flex; align-items: center; gap: var(--space-2);
  block-size: 28px; padding-inline: var(--space-3);
  border-radius: var(--radius-pill); background: var(--surface-2);
  font-size: var(--step-xs); color: var(--text-2); font-variant-numeric: tabular-nums;
}
.status .dot { inline-size: 7px; block-size: 7px; border-radius: 50%; background: var(--text-3); transition: background var(--dur-base) var(--ease-standard); }
.status[data-state="pending"] .dot, .status[data-state="streaming"] .dot { background: var(--accent); animation: pulse 1.4s var(--ease-in-out) infinite; }
.status[data-state="done"] .dot { background: var(--success); }
.status[data-state="error"] .dot { background: var(--danger); }
@keyframes pulse { 50% { transform: scale(1.5); opacity: 0.55; } }

.scroller {
  overflow-y: auto; overscroll-behavior: contain;
  padding: var(--flow-m) var(--gutter) 11rem;
  scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}
.thread { max-inline-size: 44rem; margin-inline: auto; display: flex; flex-direction: column; gap: var(--flow-s); }

/* user bubble */
.msg-user {
  align-self: flex-end; max-inline-size: min(85%, 32rem);
  padding: var(--space-3) var(--space-4);
  background: var(--surface-2);
  border-radius: var(--radius-m) var(--radius-m) var(--radius-xs) var(--radius-m);
  line-height: 1.6;
}

/* assistant message */
.msg-ai { display: flex; flex-direction: column; gap: var(--space-5); }

.steps { border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--surface); box-shadow: var(--shadow-1); }
.steps-head {
  display: flex; align-items: center; gap: var(--space-3); inline-size: 100%;
  padding: var(--space-3) var(--space-4); background: none; border: 0; cursor: pointer; text-align: start;
  font-size: var(--step-sm); color: var(--text-2); border-radius: inherit;
}
.steps-head .chev { margin-inline-start: auto; transition: transform var(--dur-base) var(--ease-out); color: var(--text-3); }
.steps[data-collapsed] .chev { transform: rotate(-90deg); }
.steps-list { list-style: none; padding: 0 var(--space-4) var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }
.step { display: flex; align-items: center; gap: var(--space-3); font-size: var(--step-sm); color: var(--text-2); }
.step[data-state="done"] { color: var(--text-3); }
.ico { position: relative; inline-size: 16px; block-size: 16px; flex: none; }
.ico > * { position: absolute; inset: 0; transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); }
.spin { border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.check { opacity: 0; transform: scale(0.6); color: var(--success); }
.check path { stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset var(--dur-slow) var(--ease-out) 60ms; }
[data-state="done"] > .ico .spin, [data-state="done"].ico .spin { opacity: 0; transform: scale(0.6); animation: none; }
[data-state="done"] > .ico .check, [data-state="done"].ico .check { opacity: 1; transform: none; }
[data-state="done"] > .ico .check path, [data-state="done"].ico .check path { stroke-dashoffset: 0; }

/* the streamed answer */
.answer { display: flex; flex-direction: column; gap: var(--space-4); color: var(--text); }
.answer .block > :is(p, ul, ol, h2, h3, h4, pre) { margin: 0; }
.answer h2, .answer h3, .answer h4 { font-size: var(--step-lg); font-weight: 650; }
.answer p, .answer li { line-height: 1.8; }
.answer ul, .answer ol { padding-inline-start: 1.25em; display: flex; flex-direction: column; gap: var(--space-2); }
.answer li::marker { color: var(--text-3); }
.answer strong { font-weight: 650; }
.answer code { background: var(--surface-2); padding: 0.1em 0.4em; border-radius: var(--radius-xs); }
.answer pre {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s);
  padding: var(--space-4); overflow-x: auto; font-size: var(--step-sm); line-height: 1.65;
}
.answer pre code { background: none; padding: 0; }
.answer .block.is-live > :is(p, h2, h3, h4):last-child::after,
.answer .block.is-live > :is(ul, ol):last-child > li:last-child::after {
  content: ""; display: inline-block; inline-size: 2px; block-size: 1.05em; margin-inline-start: 3px;
  vertical-align: -0.16em; background: var(--accent); border-radius: 1px;
  animation: caret 1.05s var(--ease-in-out) infinite;
}
@keyframes caret { 50% { opacity: 0; } }
.answer[data-state="aborted"]::after, .answer[data-state="error"]::after { content: none; }

.notice {
  display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-s);
  border: 1px solid color-mix(in oklab, var(--danger) 35%, transparent);
  background: color-mix(in oklab, var(--danger) 8%, transparent);
  font-size: var(--step-sm); color: var(--text-2);
}
.notice[data-kind="stopped"] { border-color: var(--line); background: var(--surface-2); }

/* sources: slots reserve their space; skeleton cross-fades to content, so nothing shifts */
.sources { display: flex; flex-direction: column; gap: var(--space-3); }
.sources > h4 { font-size: var(--step-sm); font-weight: 600; color: var(--text-2); }
.source {
  position: relative; display: flex; flex-direction: column; gap: var(--space-2);
  min-block-size: 112px; padding: var(--space-4);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m);
}
.source .body { display: flex; flex-direction: column; gap: var(--space-2); opacity: 0; transform: translateY(8px);
  transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out); }
.source .sk { position: absolute; inset: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); transition: opacity var(--dur-base) var(--ease-standard); }
.source .sk i { display: block; block-size: 12px; border-radius: 6px; }
.source .sk i:nth-child(1) { inline-size: 40%; } .source .sk i:nth-child(2) { inline-size: 92%; } .source .sk i:nth-child(3) { inline-size: 70%; }
.source[data-ready] .body { opacity: 1; transform: none; }
.source[data-ready] .sk { opacity: 0; }
.source .domain { display: flex; align-items: center; gap: var(--space-2); font-size: var(--step-xs); color: var(--text-3); }
.source .chip { inline-size: 18px; block-size: 18px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.source h5 { font-size: var(--step-sm); font-weight: 600; line-height: 1.4; }
.source p { font-size: var(--step-xs); color: var(--text-2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.actions { display: flex; gap: var(--space-1); opacity: 0; transform: translateY(6px); transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out); }
.actions[data-show] { opacity: 1; transform: none; }

/* composer */
.composer-wrap {
  position: fixed; inset-inline: 0; inset-block-end: 0; z-index: 3; pointer-events: none;
  padding: var(--space-6) var(--gutter) calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 55%, transparent);
}
.composer {
  pointer-events: auto; max-inline-size: 44rem; margin-inline: auto;
  display: flex; align-items: flex-end; gap: var(--space-2);

}

<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><h1>流式界面</h1></div>
    <div class="tools">
      <button class="ghost optional" id="btn-fail" type="button">模拟中断</button>
      <div class="status" id="status" data-state="idle" role="status" aria-live="polite"><span class="dot"></span><span class="label">就绪</span></div>
    </div>
  </header>

  <main class="scroller" id="scroller">
    <div class="thread" id="thread"></div>
  </main>
</div>

<button class="jump" id="jump" type="button">回到最新 ↓</button>

<div class="composer-wrap">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="问点什么，回车发送"></textarea>
    <button class="send" id="send" type="button" data-mode="send" aria-label="发送" disabled>
      <svg class="i-send" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <svg class="i-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
    </button>
  </div>
</div>

<script type="module">
// ui-fused streaming core. Zero dependencies, ESM. Inline it into single-file pages if needed.
//
// Mental model:  source (AsyncIterable<string>)  ->  buffer  ->  smoother  ->  block painter
//   - The network delivers lumpy chunks. The smoother turns them into an even, readable cadence.
//   - Settled blocks are painted once and never touched again; only the last block is live.
//   - New blocks enter with the .enter class (see ui-fused.css).

/* ------------------------------------------------------------------ sources */

/** Fake a model stream for demos/tests. Swap for readAnthropicStream(response) in production. */
async function* mockStream(text, { chunk = [2, 9], delay = [16, 70], signal } = {}) {
  const rnd = ([a, b]) => a + Math.floor(Math.random() * (b - a + 1));
  for (let i = 0; i < text.length; ) {
    if (signal?.aborted) return;
    const n = rnd(chunk);
    yield text.slice(i, i + n);
    i += n;
    await new Promise((r) => setTimeout(r, rnd(delay)));
  }
}

/** Parse a Server-Sent-Events Response body into parsed JSON payloads. */
async function* readSSE(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder(); // stream:true below keeps multi-byte chars intact across chunks
  let buf = "";
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, i);
        buf = buf.slice(i + 2);
        const data = raw
          .split("\n")
          .filter((l) => l.startsWith("data:"))
          .map((l) => l.slice(5).trimStart())
          .join("\n");
        if (!data || data === "[DONE]") continue;
        try { yield JSON.parse(data); } catch { /* ignore keep-alives / partial junk */ }
      }
    }
  } finally {
    reader.releaseLock?.();
  }
}

/** Anthropic Messages API stream -> plain text deltas. */
async function* readAnthropicStream(response) {
  for await (const ev of readSSE(response)) {
    if (ev.type === "content_block_delta" && ev.delta?.text) yield ev.delta.text;
    if (ev.type === "error") throw new Error(ev.error?.message || "stream error");
  }
}

/* ----------------------------------------------------------------- smoothing */

/**
 * How many characters to reveal this frame. Slow and readable when the backlog is small,
 * accelerating when we fall behind so the UI never lags the network by more than ~a second.
 * Pure function -> unit-testable. Returns { n, carry } (carry keeps sub-character remainders).
 */
function drain(backlog, dtMs, carry = 0, { minCps = 45, gain = 5, maxCps = 2400, ended = false } = {}) {
  if (backlog <= 0) return { n: 0, carry: 0 };
  const floor = ended ? Math.max(minCps, 500) : minCps; // once the stream ended, don't drag the tail
  const cps = Math.min(maxCps, floor + backlog * gain);
  const exact = (cps * dtMs) / 1000 + carry;
  const n = Math.min(backlog, Math.floor(exact));
  return { n, carry: n === backlog ? 0 : exact - n };
}

/* ------------------------------------------------------------ block handling */

/** Split text into blocks on blank lines, but never inside an open ``` fence. */
function splitBlocks(text) {
  const out = [];
  let cur = [];
  let fenced = false;
  for (const line of text.split("\n")) {
    if (/^```/.test(line)) fenced = !fenced;
    if (!fenced && line.trim() === "" && !/^```/.test(line)) {
      if (cur.length) out.push(cur.join("\n"));
      cur = [];
    } else {
      cur.push(line);
    }
  }
  if (cur.length) out.push(cur.join("\n"));
  return out;
}

const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/** Remove a dangling opener so half-typed `**bold` / `code doesn't flash raw punctuation. */
function hideOpenMarkers(s) {
  if ((s.match(/\*\*/g) || []).length % 2) s = s.replace(/\*\*(?![\s\S]*\*\*)/, "");
  if ((s.match(/`/g) || []).length % 2) s = s.replace(/`(?![\s\S]*`)/, "");
  return s;
}

function inline(s) {
  return esc(hideOpenMarkers(s))
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

/** Tiny, safe markdown for one block. Replace with marked / markdown-it (+ DOMPurify) if you need more. */
function miniMarkdown(block) {
  const fence = block.match(/^```(\w*)\n?([\s\S]*?)(?:\n```)?$/);
  if (fence && block.startsWith("```")) return `<pre><code>${esc(fence[2])}</code></pre>`;
  const h = block.match(/^(#{1,3})\s+(.*)$/);
  if (h) return `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
  const lines = block.split("\n");
  if (lines.every((l) => /^\s*[-*]\s+/.test(l)))
    return `<ul>${lines.map((l) => `<li>${inline(l.replace(/^\s*[-*]\s+/, ""))}</li>`).join("")}</ul>`;
  if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l)))
    return `<ol>${lines.map((l) => `<li>${inline(l.replace(/^\s*\d+[.)]\s+/, ""))}</li>`).join("")}</ol>`;
  return `<p>${lines.map(inline).join("<br>")}</p>`;
}

/* ---------------------------------------------------------------- the view */

/**
 * createStreamView(root)
 *   view.start()         -> data-state="pending" (show your thinking indicator)
 *   view.push(text)      -> append received text (any chunk size)
 *   view.end()           -> no more text; resolves view.done once fully painted
 *   view.fail(err)       -> keep partial text, data-state="error" (render your inline retry)
 *   view.abort()         -> stop immediately, data-state="aborted"
 * root[data-state] drives all styling: pending | streaming | done | error | aborted
 */
function createStreamView(root, { renderBlock = miniMarkdown, onFrame, smoothing = {} } = {}) {
  let target = "";
  let shown = 0;
  let carry = 0;
  let ended = false;
  let raf = 0;
  let last = 0;
  let resolveDone;
  const done = new Promise((r) => (resolveDone = r));
  const views = []; // { el, html }

  const setState = (s) => (root.dataset.state = s);

  function paint() {
    let text = target.slice(0, shown);
    const prev = text.charCodeAt(text.length - 1);
    if (prev >= 0xd800 && prev <= 0xdbff) text = text.slice(0, -1); // don't cut an emoji in half
    const blocks = splitBlocks(text);
    blocks.forEach((b, i) => {
      const html = renderBlock(b);
      let v = views[i];
      if (!v) {
        const el = document.createElement("div");
        el.className = "block enter";
        root.append(el);
        v = views[i] = { el, html: "" };
      }
      if (v.html !== html) {
        v.el.innerHTML = html;
        v.html = html;
      }
      v.el.classList.toggle("is-live", i === blocks.length - 1 && !(ended && shown >= target.length));
    });
    onFrame?.();
  }

  function frame(now) {
    const dt = Math.min(64, now - (last || now));
    last = now;
    const { n, carry: c } = drain(target.length - shown, dt, carry, { ended, ...smoothing });
    shown += n;
    carry = c;
    paint();
    if (ended && shown >= target.length) return finish();
    raf = requestAnimationFrame(frame);
  }

  function finish() {
    views.forEach((v) => v.el.classList.remove("is-live"));
    if (root.dataset.state === "streaming") setState("done");
    resolveDone();
  }

  const kick = () => { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } };

  return {
    done,
    get text() { return target; },
    start() { setState("pending"); },
    push(t) {
      if (!t) return;
      if (root.dataset.state === "pending") setState("streaming");
      target += t;
      kick();
    },
    end() { ended = true; kick(); },
    fail(err) {
      cancelAnimationFrame(raf); raf = 0;
      shown = target.length; paint();
      views.forEach((v) => v.el.classList.remove("is-live"));
      setState("error");
      root.dataset.error = err?.message || String(err ?? "");
      resolveDone();
    },
    abort() {
      cancelAnimationFrame(raf); raf = 0;
      views.forEach((v) => v.el.classList.remove("is-live"));
      setState("aborted");
      resolveDone();
    },
  };
}

/* -------------------------------------------------------------- auto-scroll */

/**
 * Keep a scroller pinned to the bottom while content grows, but let go the moment the user
 * scrolls up. onChange(stuck) lets you show/hide a "Jump to latest" pill.
 */
function stickToBottom(scroller, content, { threshold = 72, onChange } = {}) {
  let stuck = true;
  const gap = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight;
  const set = (v) => { if (v !== stuck) { stuck = v; onChange?.(v); } };
  scroller.addEventListener("scroll", () => set(gap() <= threshold), { passive: true });
  const ro = new ResizeObserver(() => { if (stuck) scroller.scrollTop = scroller.scrollHeight; });
  ro.observe(content);
  return {
    get stuck() { return stuck; },
    jump(smooth = true) {
      set(true);
      scroller.scrollTo({ top: scroller.scrollHeight, behavior: smooth ? "smooth" : "auto" });
    },
    destroy() { ro.disconnect(); },
  };
}

/** Convenience: pipe any AsyncIterable<string> into a view, with error + abort handling. */
async function pipe(source, view) {
  view.start();
  try {
    for await (const chunk of source) view.push(chunk);
    view.end();
  } catch (err) {
    if (err?.name === "AbortError") view.abort();
    else view.fail(err);
  }
  return view.done;
}

// ui-fused helpers. Zero dependencies. Paste inline into a single-file page or import as a module.
// Pairs with motion-tokens.css (.reveal / .is-in / [data-stagger]).

const prefersReducedMotion = () =>
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/**
 * Reveal elements when they enter the viewport. Siblings inside a [data-stagger]
 * parent get --i set from DOM order so they cascade instead of popping together.
 * Elements already in view on load reveal immediately (one orchestrated entrance).
 */
function reveal(root = document, { selector = ".reveal", threshold = 0.15, margin = "0px 0px -8% 0px" } = {}) {
  const items = [...root.querySelectorAll(selector)];
  items.forEach((el) => {
    const parent = el.parentElement;
    if (parent && parent.hasAttribute("data-stagger") && !el.style.getPropertyValue("--i")) {
      el.style.setProperty("--i", [...parent.children].indexOf(el));
    }
  });
  if (!("IntersectionObserver" in window)) {
    items.forEach((el) => el.classList.add("is-in"));
    return () => {};
  }
  const io = new IntersectionObserver(
    (entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        e.target.classList.add("is-in");
        io.unobserve(e.target);
      }
    },
    { threshold, rootMargin: margin }
  );
  items.forEach((el) => io.observe(el));
  return () => io.disconnect();
}

/**
 * FLIP: animate any layout change (reorder, filter, resize) smoothly.
 *   await flip(listEl.children, () => listEl.append(listEl.firstElementChild));
 * Measures first, runs your DOM mutation, measures last, plays the inverse transform.
 */
function flip(elements, mutate, { duration = 360, easing = "cubic-bezier(0.16, 1, 0.3, 1)" } = {}) {
  const els = [...elements];
  const first = new Map(els.map((el) => [el, el.getBoundingClientRect()]));
  mutate();
  if (prefersReducedMotion()) return Promise.resolve();
  const anims = [];
  for (const el of els) {
    const a = first.get(el);
    const b = el.getBoundingClientRect();
    const dx = a.left - b.left;
    const dy = a.top - b.top;
    if (!dx && !dy) continue;
    anims.push(
      el.animate(
        [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }],
        { duration, easing, fill: "backwards" }
      ).finished.catch(() => {})
    );
  }
  return Promise.all(anims);
}

/** Count a number up. Honors reduced motion by jumping to the end. */
function countUp(el, to, { from = 0, duration = 900, format = (n) => Math.round(n).toLocaleString() } = {}) {
  if (prefersReducedMotion()) {
    el.textContent = format(to);
    return;
  }
  const t0 = performance.now();
  const ease = (t) => 1 - Math.pow(1 - t, 4); // out-quart
  const tick = (now) => {
    const t = Math.min(1, (now - t0) / duration);
    el.textContent = format(from + (to - from) * ease(t));
    if (t < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/**
 * Wrap a DOM update in a View Transition when supported (cross-fades + morphs elements
 * that share a view-transition-name). Falls back to just running the update.
 */
function transition(update) {
  if (!document.startViewTransition || prefersReducedMotion()) return Promise.resolve(update());
  return document.startViewTransition(update).finished.catch(() => {});
}


/* ===== demo wiring ===== */
const $ = (s) => document.querySelector(s);
const thread = $("#thread"), scroller = $("#scroller"), input = $("#input"), send = $("#send"), jump = $("#jump");
const statusEl = $("#status");
const LABELS = { idle: "就绪", pending: "思考中", streaming: "生成中", done: "已完成", error: "已中断", aborted: "已停止" };
const setStatus = (s) => { statusEl.dataset.state = s; statusEl.querySelector(".label").textContent = LABELS[s]; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const ANSWER = [
  "## 先让每个中间状态都好看",
  "",
  "流式界面的难点不在“字一个个出来”，而在于**每一帧都得是设计过的状态**。网络给你的是不均匀的数据块，用户需要的是稳定、可读的节奏。",
  "",
  "做法可以归结为三件事：",
  "",
  "- 用平滑器把 chunk 变成匀速输出，积压多时自动加速",
  "- 已完成的段落只渲染一次，只有最后一段保持“活”的",
  "- 先为内容预留空间再淡入，页面不会跳动",
  "",
  "核心循环每一帧只做三件事：",
  "",
  "```js",
  "const { n, carry } = drain(backlog, dt, carry);",
  "shown += n;",
  "paint(); // 只重绘最后一个 block",
  "```",
  "",
  "用户向上滚动时就松开吸底，并给出“回到最新”的入口。**尊重阅读，比跟随更重要。**",
].join("\n");

const SOURCES = [
  { d: "motion.dev", c: "M", t: "Spring 与时长：动效的物理直觉", s: "弹簧比固定时长的贝塞尔曲线更像真实物体，也更容易被打断。" },
  { d: "web.dev", c: "W", t: "用 transform 和 opacity 做动画", s: "只动合成层属性，主线程空闲，才能稳定 60fps。" },
  { d: "nngroup.com", c: "N", t: "响应时间的三个界限", s: "0.1 秒像即时，1 秒不打断思路，超过 10 秒需要进度反馈。" },
];

const STEPS = ["理解问题", "检索资料", "组织回答"];

const check = '<svg class="check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const chev = '<svg class="chev" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';

const bottom = stickToBottom(scroller, thread, { onChange: (stuck) => toggleJump(!stuck && running) });
let running = false, ctrl = null, failMode = false;
const toggleJump = (on) => (on ? jump.setAttribute("data-show", "") : jump.removeAttribute("data-show"));
jump.addEventListener("click", () => { bottom.jump(); toggleJump(false); });

function el(html, cls) {
  const d = document.createElement("div");
  d.className = cls || "";
  d.innerHTML = html;
  return d;
}

async function run(prompt) {
  running = true; ctrl = new AbortController();
  send.dataset.mode = "stop"; send.disabled = false; send.setAttribute("aria-label", "停止");
  bottom.jump(false);

  const user = el("", "msg-user enter"); user.textContent = prompt; thread.append(user);
  const ai = el("", "msg-ai enter");
  thread.append(ai);
  setStatus("pending");

  // 1. thinking steps: appear one by one, spinner -> check
  const steps = el(`<button class="steps-head" type="button"><span class="ico"><i class="spin"></i>${check}</span><span class="title">正在思考…</span>${chev}</button>
    <div class="collapse" data-open><div><ul class="steps-list"></ul></div></div>`, "steps enter");
  ai.append(steps);
  const list = steps.querySelector(".steps-list"), head = steps.querySelector(".steps-head"), box = steps.querySelector(".collapse");
  head.addEventListener("click", () => {
    const open = box.hasAttribute("data-open");
    box.toggleAttribute("data-open", !open); steps.toggleAttribute("data-collapsed", open);
  });

  try {
    for (const label of STEPS) {
      if (ctrl.signal.aborted) throw new DOMException("aborted", "AbortError");
      const li = document.createElement("li"); li.className = "step enter";
      li.innerHTML = `<span class="ico"><i class="spin"></i>${check}</span><span>${label}</span>`;
      list.append(li);
      await sleep(620 + Math.random() * 300);
      li.dataset.state = "done";
    }
    head.querySelector(".ico").dataset.state = "done";
    head.querySelector(".title").textContent = `已完成 ${STEPS.length} 步思考`;
    box.removeAttribute("data-open"); steps.setAttribute("data-collapsed", "");

    // 2. stream the answer
    const answer = el("", "answer"); answer.setAttribute("aria-busy", "true"); ai.append(answer);
    const view = createStreamView(answer);
    const onStop = () => ctrl.abort();
    ctrl.signal.addEventListener("abort", onStop, { once: true });
    view.start();
    setStatus("streaming");
    let failed = false;
    try {
      for await (const chunk of mockStream(ANSWER, { chunk: [1, 5], delay: [28, 80], signal: ctrl.signal })) {
        if (ctrl.signal.aborted) break;
        view.push(chunk);
        if (failMode && view.text.length > ANSWER.length * 0.55) throw new Error("连接中断");
      }
      if (ctrl.signal.aborted) { view.abort(); } else { view.end(); }
    } catch (err) { failed = true; view.fail(err); }
    await view.done;
    answer.setAttribute("aria-busy", "false");

    if (failed) {
      setStatus("error");
      const n = el(`<span>生成中断了，已保留收到的内容。</span><button class="btn" type="button" data-variant="primary" style="block-size:32px">重试</button>`, "notice enter");
      n.querySelector("button").addEventListener("click", () => { failMode = false; n.remove(); answer.remove(); steps.remove(); user.remove(); ai.remove(); run(prompt); });
      ai.append(n);
    } else if (ctrl.signal.aborted) {
      setStatus("aborted");
      const stopped = el("<span>已停止生成。</span>", "notice enter");
      stopped.dataset.kind = "stopped";
      ai.append(stopped);
    } else {
      setStatus("done");
      // 3. sources: slots reserve space first, then fill in as they "arrive"
      const wrap = el("<h4>参考来源</h4>", "sources enter");
      const grid = el("", "grid-auto"); grid.style.setProperty("--min", "13rem"); grid.style.setProperty("--gap", "var(--space-3)");
      const slots = SOURCES.map(() => {
        const s = el(`<div class="sk"><i class="skeleton"></i><i class="skeleton"></i><i class="skeleton"></i></div><div class="body"></div>`, "source");
        grid.append(s); return s;
      });
      wrap.append(grid); ai.append(wrap);
      for (let i = 0; i < SOURCES.length; i++) {
        await sleep(380 + Math.random() * 260);
        if (!slots[i].isConnected) break;
        const s = SOURCES[i];
        slots[i].querySelector(".body").innerHTML = `<div class="domain"><span class="chip">${s.c}</span>${s.d}</div><h5>${s.t}</h5><p>${s.s}</p>`;
        slots[i].setAttribute("data-ready", "");
      }
      const actions = el(`<button class="ghost" type="button" data-act="copy">复制</button><button class="ghost" type="button" data-act="again">重新生成</button>`, "actions");
      ai.append(actions);
      requestAnimationFrame(() => requestAnimationFrame(() => actions.setAttribute("data-show", "")));
      actions.addEventListener("click", async (e) => {
        const act = e.target.dataset.act;
        if (act === "copy") { try { await navigator.clipboard.writeText(ANSWER); } catch {} e.target.textContent = "已复制"; setTimeout(() => (e.target.textContent = "复制"), 1400); }
        if (act === "again") submit(prompt);
      });
    }
  } catch (err) {
    if (err?.name === "AbortError") setStatus("aborted"); else setStatus("error");
  } finally {
    running = false; ctrl = null;
    send.dataset.mode = "send"; send.setAttribute("aria-label", "发送"); send.disabled = !input.value.trim();
    toggleJump(false);
  }
}

function submit(text) {
  const v = (text ?? input.value).trim();
  if (!v || running) return;
  input.value = ""; send.disabled = true;
  run(v);
}

send.addEventListener("click", () => (running ? ctrl?.abort() : submit()));
input.addEventListener("input", () => { if (!running) send.disabled = !input.value.trim(); });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } });
$("#btn-fail").addEventListener("click", () => { failMode = true; submit("演示一次中途失败，看看界面怎么收尾"); });

reveal(document);
run("流式界面应该怎么设计，才能既好看又不抖？");
</script>
</body>
</html>
